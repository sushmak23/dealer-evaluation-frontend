<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dealer Evaluation</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Dealer Evaluation</h1>
    <p>Choose a product to evaluate dealers and pricing:</p>
  </header>

  <main>
    <div class="container">
      <label for="productDropdown">Select Product:</label>
      <select id="productDropdown">
        <!-- Options will be populated dynamically using JavaScript -->
      </select>

      <div id="dealersSection">
        <h3>Dealers for the Selected Product:</h3>
        <ul id="dealersList">
          <!-- Dealer details will be shown here -->
        </ul>
      </div>

      <div id="priceSection">
        <h3>Price Details:</h3>
        <p id="productPrice"></p>
      </div>
    </div>
  </main>

  <footer>
    <p>© 2025 Dealer Evaluation</p>
  </footer>

  <script src="scripts.js"></script>
</body>
</html>
